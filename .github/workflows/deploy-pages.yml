name: Deploy PRINT//CORE 5 Portal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola implementación concurrente para evitar conflictos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar artefactos de portal_web
        uses: actions/upload-pages-artifact@v3
        with:
          # Despliega el contenido de portal_web como raíz de GitHub Pages
          path: 'portal_web'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
